syntax = "proto3";

option java_multiple_files = true;
option java_package = "co.appointment.grpc";
option java_outer_classname = "AuthProto";

// Import Google's well-known wrapper types
import "google/protobuf/wrappers.proto";

service AuthService {
    rpc ProcessUserByEmail(google.protobuf.StringValue) returns (GetUserResponse) {}
    rpc ProcessUserById(google.protobuf.StringValue) returns (GetUserResponse) {}
    rpc ProcessVerificationTokenByEmail(google.protobuf.StringValue) returns (GetVerificationTokenResponse) {}
}

message GetUserResponse {
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string email = 4;
    string contact_no = 5;
    string full_name = 6;
    repeated string roles = 7;
}
message GetVerificationTokenResponse {
    string id = 1;
    string token = 2;
    uint64 expiry_date = 3;
    string token_type = 4;
}
